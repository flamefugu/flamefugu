<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Connected · Episode 2</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .25s}
iframe.on{opacity:1;pointer-events:auto;z-index:2}
</style></head><body>
<!-- Host dua ponsel. Taruh file ini satu folder dengan kedua file ponsel. Ganti nama file di bawah kalau namanya berbeda. -->
<iframe id="me" class="on" src="ponsel_aku_ep2_chat.html"></iframe>
<iframe id="nami" src="ponsel_nami_ep2_call.html"></iframe>
<script>
var F={me:document.getElementById('me'),nami:document.getElementById('nami')},cur='me';
function show(k){cur=k;for(var n in F)F[n].classList.toggle('on',n===k)}
window.addEventListener('message',function(e){
 var d=e.data;if(!d||typeof d!=='object')return;
 var from=e.source===F.me.contentWindow?'me':e.source===F.nami.contentWindow?'nami':null;if(!from)return;
 /* tombol "Ganti ponsel" di Pengaturan Cepat */
 if(d.switchPhone)return show(from==='me'?'nami':'me');
 /* chat antar-ponsel (xmsg) diteruskan ke ponsel satunya */
 if(d.xmsg){var to=from==='me'?'nami':'me';try{F[to].contentWindow.postMessage(d,'*')}catch(_){}}
});
</script></body></html>
