<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Episode 2</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
iframe.ph{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .25s}
iframe.ph.on{opacity:1;pointer-events:auto;z-index:2}
#bk{position:fixed;left:auto;top:auto;right:auto;bottom:auto;width:0;height:0;border:0;background:transparent;z-index:10;display:none;opacity:1;pointer-events:auto}
#bk.tab{display:block;right:0;top:62%;width:28px;height:88px}
#bk.full{display:block;left:0;top:0;width:100%;height:100%}
#bk.np{pointer-events:none}
</style></head><body>
<!-- Mulai dari ponsel Nami (layar mati lalu menyala), lalu otomatis pindah ke ponsel Aku. Host dua ponsel + buku kasus (buku_kasus.html). Taruh satu folder dengan ketiga file. -->
<iframe id="me" class="ph" src="ponsel_aku_ep2_chat.html"></iframe>
<iframe id="nami" class="ph on" src="ponsel_nami_ep2_call.html"></iframe>
<iframe id="bk" src="buku_kasus.html" allowtransparency="true"></iframe>
<script>
var F={me:document.getElementById('me'),nami:document.getElementById('nami')},cur='nami';
var EPISODE=2,PHONES=[F.me,F.nami];
function tellActive(){for(var n in F){try{F[n].contentWindow.postMessage({ep2Active:n===cur},'*')}catch(_){}}}
function show(k){cur=k;for(var n in F)F[n].classList.toggle('on',n===k);tellActive()}
for(var q in F)F[q].addEventListener('load',function(){setTimeout(tellActive,200)});
/* ===== Buku kasus (satu file untuk semua episode: buku_kasus.html) ===== */
var bk=document.getElementById('bk'),bkOk=false,bkQ=[];
function toBk(d){if(!bkOk){bkQ.push(d);return}try{bk.contentWindow.postMessage(d,'*')}catch(_){}}
function toPhones(d){PHONES.forEach(function(f){try{f.contentWindow.postMessage(d,'*')}catch(_){}})}
function bkMsg(e,d){
 if(e.source===bk.contentWindow){
  if(d.bkLayout){bk.className=d.bkLayout==='hidden'?'':d.bkLayout;if(d.pe===false)bk.classList.add('np')}
  if(d.bkInfo||d.bkState)toPhones(d);
  if(d.bkReady){bkOk=true;try{bk.contentWindow.postMessage({caseEp:EPISODE},'*')}catch(_){}bkQ.splice(0).forEach(function(x){try{bk.contentWindow.postMessage(x,'*')}catch(_){}})}
  return true}
 if(d.caseEv||d.caseStart||d.caseTxt||d.caseProf||d.caseImg||d.bkOpen||d.bkReset||d.bkDemo){toBk(d);return true}
 return false}
window.addEventListener('message',function(e){
 var d=e.data;if(!d||typeof d!=='object')return;
 if(bkMsg(e,d))return;
 var from=e.source===F.me.contentWindow?'me':e.source===F.nami.contentWindow?'nami':null;if(!from)return;
 /* tombol "Ganti ponsel" di Pengaturan Cepat */
 if(d.switchPhone)return show(from==='me'?'nami':'me');
 /* chat antar-ponsel (xmsg) diteruskan ke ponsel satunya */
 if(d.xmsg){var to=from==='me'?'nami':'me';try{F[to].contentWindow.postMessage(d,'*')}catch(_){}}
});
</script></body></html>
